[project]
name = "energix-global"
version = "1.1.0"
description = "Pipeline de dados e dashboard sobre a participação de renováveis na geração elétrica mundial (2000–2025)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Renan Pinheiro" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Demo = "https://energix-global.vercel.app"
Repository = "https://github.com/pinheiro-dataworks/Energix-Global"

# O projeto não é distribuído como pacote: este arquivo concentra metadados
# e a configuração das ferramentas. Instale com requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
